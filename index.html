<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070B09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>特種兵行程規劃 — 極限旅遊最佳化</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <style>
      /* 首屏骨架：JS bundle 載入前就先顯示，React 掛載後會整個被取代 */
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:18px;background:#070B09;color:#E8A33D;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
      #boot .ring{width:38px;height:38px;border:2px solid rgba(232,163,61,.22);border-top-color:#E8A33D;
        border-radius:50%;animation:bspin .9s linear infinite}
      #boot .t{font-size:.82rem;letter-spacing:.22em}
      #boot .s{font-size:.72rem;color:#6E7A72;letter-spacing:.06em}
      @keyframes bspin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#boot .ring{animation:none}}
    </style>
    <div id="root"><div id="boot">
      <div class="ring"></div>
      <div class="t">MISSION BRIEFING</div>
      <div class="s">正在載入行程規劃引擎</div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
